name: Build searchable chunks

on:
  workflow_dispatch:
  push:
    paths:
      - "FPF-Spec.md"
      - "tools/split_fpf.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Split FPF spec into chunks
        run: python tools/split_fpf.py

      - name: Commit chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fpf_chunks

          if git diff --cached --quiet; then
            echo "No chunk changes to commit."
            exit 0
          fi

          git commit -m "chore: rebuild fpf chunks"
          git push
